name: Keep Render site awake

# Render's free web services sleep after 15 minutes without traffic.
# This loads the tours page every 10 minutes so the service stays running.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the tours page
        run: |
          curl --silent --show-error --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 180 \
            https://tour-travels-otuu.onrender.com/tours/
