{% extends 'base.html' %}
{% block title %}Log in{% endblock %}

{% block content %}
<section class="auth-wrap"><div class="container">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p>Log in to manage your bookings and payments.</p>
    <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}" novalidate>
      {% csrf_token %}
      <div class="stack">
        {% include '_form_fields.html' %}
      </div>
      <div class="form-foot"><button class="btn btn-dark btn-block" type="submit">Log in</button></div>
    </form>
    <p class="auth-foot"><a class="linkish" href="{% url 'password_reset' %}">Forgot your password?</a></p>
    <p class="auth-foot">New here? <a class="linkish" href="{% url 'register' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Create an account</a></p>
  </div>
</div></section>
{% endblock %}
