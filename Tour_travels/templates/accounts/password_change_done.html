{% extends layout %}
{% block title %}Password changed{% endblock %}

{% block dash %}
<div class="panel" style="max-width:560px;text-align:center;margin:30px auto">
  <h1>Password changed</h1>
  <p style="color:var(--muted)">Your password has been updated. Use your new password the next time you sign in.</p>
  <a class="btn btn-dark" href="{{ dash_home }}">Back to my dashboard</a>
</div>
{% endblock %}
