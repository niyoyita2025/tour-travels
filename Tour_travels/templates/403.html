{% extends 'base.html' %}
{% block title %}Access denied{% endblock %}

{% block content %}
<section class="error-page"><div class="container">
  <h1>403</h1>
  <p style="color:var(--muted);font-size:1.1rem">You do not have permission to open this page.</p>
  <p>
    {% if user.is_authenticated %}
      <a class="btn btn-dark" href="{{ dash_home }}">Go to my dashboard</a>
    {% else %}
      <a class="btn btn-dark" href="{% url 'login' %}">Sign in</a>
    {% endif %}
  </p>
</div></section>
{% endblock %}
