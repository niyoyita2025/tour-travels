{% comment %}One form field with its label, help text and errors. The same markup as _form_fields.html.{% endcomment %}
<div class="field{% if field.errors %} has-error{% endif %}{% if field.field.widget.attrs.rows %} full{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
